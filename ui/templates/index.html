<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChessEngine-LLM Web UI</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- jQuery (required for chessboard.js) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- chessboard.js CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <style>
        :root {
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --surface: #1E293B;
            --surface-alt: #273548;
            --background: #0F172A;
            --text: #F8FAFC;
            --text-muted: #94A3B8;
            --border: #334155;
            --accent: #10B981;
            --danger: #EF4444;
            --white-advantage: #60A5FA;
            --black-advantage: #F472B6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        /* -------- HEADER -------- */
        .header {
            width: 100%;
            background: linear-gradient(135deg, var(--surface) 0%, #1a2744 100%);
            padding: 18px 0;
            box-shadow: 0 4px 12px rgba(0,0,0,.25);
            text-align: center;
            border-bottom: 1px solid var(--border);
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(to right, #60A5FA, #A78BFA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            margin-top: 4px;
            color: var(--text-muted);
            font-size: 13px;
            letter-spacing: .3px;
        }

        /* -------- LAYOUT -------- */
        .main-layout {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 32px 20px;
            flex-wrap: wrap;
        }

        /* -------- EVAL BAR (left of board) -------- */
        .eval-bar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .eval-bar-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }
        .eval-bar-wrapper {
            width: 32px;
            height: 440px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
            background: #1a1a2e;
        }
        .eval-bar-white {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, #e2e8f0, #cbd5e1);
            transition: height 0.6s cubic-bezier(.4,0,.2,1);
        }
        .eval-bar-black {
            position: absolute;
            top: 0;
            width: 100%;
            background: linear-gradient(to bottom, #1e1e2e, #334155);
            transition: height 0.6s cubic-bezier(.4,0,.2,1);
        }
        .eval-bar-score {
            font-size: 14px;
            font-weight: 700;
            min-width: 56px;
            text-align: center;
            padding: 4px 8px;
            border-radius: 6px;
            background: var(--surface-alt);
            border: 1px solid var(--border);
            transition: color 0.3s;
        }
        .eval-bar-score.positive { color: var(--white-advantage); }
        .eval-bar-score.negative { color: var(--black-advantage); }
        .eval-bar-score.neutral  { color: var(--text-muted); }

        /* -------- BOARD -------- */
        .board-wrap {
            background: var(--surface);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(0,0,0,.2);
            border: 1px solid var(--border);
        }
        /* chessboard.js overrides */
        .board-b72b1 { border: 2px solid var(--border) !important; border-radius: 4px; }
        .white-1e1d7 { background-color: #E2E8F0; color: #475569; }
        .black-3c85d { background-color: #64748B; color: #F1F5F9; }

        /* -------- SIDEBAR -------- */
        .sidebar {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .card h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 12px;
        }

        /* Toggle */
        .toggle-btn {
            display: flex;
            background: var(--background);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .toggle-btn button {
            flex: 1;
            padding: 10px 6px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        .toggle-btn button.active {
            background: var(--primary);
            color: white;
        }
        .toggle-btn button:hover:not(.active) {
            background: var(--surface-alt);
        }

        /* Status */
        .status-box {
            background: var(--background);
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--accent);
            min-height: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Eval detail in sidebar */
        .eval-detail {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--background);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .eval-detail .eval-label { font-size: 13px; color: var(--text-muted); }
        .eval-detail .eval-value {
            font-size: 22px;
            font-weight: 700;
            font-family: 'JetBrains Mono', 'Inter', monospace;
        }
        .eval-detail .eval-value.positive { color: var(--white-advantage); }
        .eval-detail .eval-value.negative { color: var(--black-advantage); }
        .eval-detail .eval-value.neutral  { color: var(--text-muted); }

        /* Buttons */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 11px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: scale(0.97); }
        .btn.danger { background: var(--danger); }
        .btn.danger:hover { background: #DC2626; }

        /* Loader */
        .loader {
            border: 2px solid rgba(255,255,255,0.15);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 14px; height: 14px;
            animation: spin .8s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Move history */
        .move-history {
            max-height: 120px;
            overflow-y: auto;
            background: var(--background);
            border-radius: 8px;
            border: 1px solid var(--border);
            padding: 10px 12px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            line-height: 1.7;
        }
        .move-history span.move-number { color: var(--text-muted); opacity: .6; }
        .move-history span.white-move  { color: var(--text); }
        .move-history span.black-move  { color: #cbd5e1; }

        /* Game over overlay */
        .game-over-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 10px;
            backdrop-filter: blur(4px);
        }
        .game-over-text {
            font-size: 22px;
            font-weight: 700;
            color: #F8FAFC;
            text-align: center;
            padding: 20px 32px;
            background: rgba(99, 102, 241, 0.25);
            border: 1px solid rgba(99, 102, 241, 0.5);
            border-radius: 12px;
        }

        /* Highlight Moves */
        .highlight-move {
            box-shadow: inset 0 0 3px 3px rgba(234, 179, 8, 0.7);
            background-color: rgba(234, 179, 8, 0.25) !important;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>♟ ChessEngine-LLM</h1>
        <p>A hybrid Heuristic &amp; NNUE-Inspired PyTorch Chess Engine</p>
    </div>

    <div class="main-layout">

        <!-- Eval Bar -->
        <div class="eval-bar-container">
            <div class="eval-bar-label">Eval</div>
            <div class="eval-bar-wrapper">
                <div class="eval-bar-black" id="evalBarBlack" style="height:50%"></div>
                <div class="eval-bar-white" id="evalBarWhite" style="height:50%"></div>
            </div>
            <div class="eval-bar-score neutral" id="evalBarScore">0.00</div>
        </div>

        <!-- Board -->
        <div class="board-wrap">
            <div id="board" style="width:440px"></div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">

            <div class="card">
                <h3>Evaluation Backend</h3>
                <div class="toggle-btn" id="engineToggle">
                    <button class="active" data-nn="false">Heuristic</button>
                    <button data-nn="true">NNUE-Inspired</button>
                </div>
            </div>

            <div class="card">
                <h3>Settings</h3>
                <div style="margin-bottom: 10px;">
                    <label style="font-size: 13px; font-weight: 600; color: #a1a1aa;">Play as:</label>
                    <div class="toggle-btn" id="playerColorToggle" style="margin-top: 5px;">
                        <button class="active" data-color="white">White</button>
                        <button data-color="black">Black</button>
                    </div>
                </div>
                <div>
                    <button class="btn" id="flipBoardBtn" style="width: 100%; background: #3f3f46; border: 1px solid #52525b;">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="vertical-align: middle; margin-right: 5px;"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Flip Board
                    </button>
                </div>
            </div>

            <div class="card">
                <h3>Status</h3>
                <div class="status-box" id="statusBox">
                    Your turn (White)
                </div>
            </div>

            <div class="card">
                <h3>Move History</h3>
                <div class="move-history" id="moveHistory">
                    <em style="opacity:.5">No moves yet</em>
                </div>
            </div>

            <button class="btn danger" id="newGameBtn">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                New Game
            </button>
        </div>
    </div>

<script>
    var board = null;
    var useNN = false;
    var playerColor = 'white';
    var isEngineThinking = false;
    var isGameOver = false;
    var moveList = [];
    var currentSessionId = 0;
    var $status = $('#statusBox');
    
    function pieceTheme(piece) {
        return 'https://chessboardjs.com/img/chesspieces/wikipedia/' + piece + '.png';
    }

    // ─── Eval display helpers ───
    function updateEval(evalInfo) {
        if (!evalInfo) return;

        var $barWhite = $('#evalBarWhite');
        var $barBlack = $('#evalBarBlack');
        var $barScore = $('#evalBarScore');

        var score = evalInfo.score;
        var mate  = evalInfo.mate;
        var displayText;

        if (mate !== null && mate !== undefined) {
            // Mate score
            if (mate === 0) {
                displayText = '#';
            } else {
                displayText = 'M' + Math.abs(mate);
            }
            // Full bar towards the winning side
            var whitePct = mate >= 0 ? 98 : 2;
            $barWhite.css('height', whitePct + '%');
            $barBlack.css('height', (100 - whitePct) + '%');
            var cls = mate >= 0 ? 'positive' : 'negative';
            $barScore.text(displayText).removeClass('positive negative neutral').addClass(cls);
        } else {
            // Normal pawn-unit score
            // Clamp display to ±5 for the bar (Lichess-like)
            var clamped = Math.max(-5, Math.min(5, score));
            var whitePct = 50 + (clamped / 5) * 50;
            $barWhite.css('height', whitePct + '%');
            $barBlack.css('height', (100 - whitePct) + '%');

            var sign = score > 0 ? '+' : '';
            displayText = sign + score.toFixed(1);

            var cls = 'neutral';
            if (score > 0.15)  cls = 'positive';
            if (score < -0.15) cls = 'negative';

            $barScore.text(displayText).removeClass('positive negative neutral').addClass(cls);
        }
    }

    // ─── Game Over Overlay ───
    function showGameOver(reason) {
        isGameOver = true;
        var $overlay = $('<div class="game-over-overlay"><div class="game-over-text">' + reason + '</div></div>');
        $('.board-wrap').css('position', 'relative').append($overlay);
        $status.text(reason);
    }

    function clearGameOver() {
        isGameOver = false;
        $('.game-over-overlay').remove();
    }

    function handleStatus(status) {
        if (!status) return;
        var turnText = 'Your turn (' + (playerColor === 'white' ? 'White' : 'Black') + ')';
        if (status.game_over) {
            showGameOver(status.reason || 'Game Over!');
        } else if (status.reason === 'Check!') {
            $status.text('Check! ' + turnText);
        } else {
            $status.text(turnText);
        }
    }

    // ─── Move Highlight ───
    function highlightMove(source, target) {
        $('#board .square-55d63').removeClass('highlight-move');
        if (source) $('#board .square-' + source).addClass('highlight-move');
        if (target) $('#board .square-' + target).addClass('highlight-move');
    }

    // ─── Move history ───
    function renderHistory() {
        if (moveList.length === 0) {
            $('#moveHistory').html('<em style="opacity:.5">No moves yet</em>');
            return;
        }
        var html = '';
        moveList.forEach(function(pair, i) {
            html += '<span class="move-number">' + (i+1) + '.</span> ';
            html += '<span class="white-move">' + pair.white + '</span>';
            if (pair.black) {
                html += ' <span class="black-move">' + pair.black + '</span>';
            }
            html += '  ';
        });
        $('#moveHistory').html(html);
        var el = document.getElementById('moveHistory');
        el.scrollTop = el.scrollHeight;
    }

    // ─── Settings Toggles & Flip ───
    $('#playerColorToggle button').click(function() {
        if (isEngineThinking || isGameOver) return;
        $('#playerColorToggle button').removeClass('active');
        $(this).addClass('active');
        playerColor = $(this).data('color');
        // Instantly flip the board visually to match preference
        board.orientation(playerColor);
    });

    $('#flipBoardBtn').click(function() {
        board.flip();
    });

    $('#engineToggle button').click(function() {
        if (isEngineThinking || isGameOver) return;
        $('#engineToggle button').removeClass('active');
        $(this).addClass('active');
        useNN = $(this).data('nn') === true;

        $.ajax({
            type: 'POST',
            url: '/switch_engine',
            contentType: 'application/json',
            data: JSON.stringify({ use_nn: useNN }),
            success: function(resp) {
                if (resp.eval) updateEval(resp.eval);
            }
        });
    });

    // ─── Board config ───
    var config = {
        draggable: true,
        position: 'start',
        pieceTheme: pieceTheme,
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
    };
    board = Chessboard('board', config);

    function onDragStart(source, piece) {
        if (isEngineThinking || isGameOver) return false;
        if (playerColor === 'white' && piece.search(/^b/) !== -1) return false;
        if (playerColor === 'black' && piece.search(/^w/) !== -1) return false;
    }

    function onDrop(source, target) {
        if (source === target) return 'snapback';

        highlightMove(source, target);

        isEngineThinking = true;
        $status.html('Engine is thinking… <div class="loader" style="display:inline-block;margin-bottom:-3px"></div>');
        
        var mySessionId = currentSessionId;

        // 1. Send Human Move
        $.ajax({
            type: 'POST',
            url: '/human_move',
            contentType: 'application/json',
            data: JSON.stringify({ source: source, target: target, use_nn: useNN }),
            success: function(r) {
                if (mySessionId !== currentSessionId) return; // Abort if game was reset
                
                if (r.error) {
                    isEngineThinking = false;
                    $status.text('Illegal move! Try again.');
                    board.position(r.fen, false);
                    highlightMove(null, null);
                    return;
                }

                // Human move was legal, update board instantly (fixes castling, en passant, promotion UI)
                board.position(r.fen, false);

                // Record human move in history
                var humanUci = source + target;
                if (playerColor === 'white') {
                    var currentPair = moveList[moveList.length - 1];
                    if (!currentPair || currentPair.black) {
                        moveList.push({ white: humanUci, black: null });
                    }
                } else {
                    var currentPair = moveList[moveList.length - 1];
                    if (currentPair) {
                        currentPair.black = humanUci;
                    }
                }
                renderHistory();
                
                if (r.eval) updateEval(r.eval);
                handleStatus(r.status);

                if (r.status && r.status.game_over) {
                    isEngineThinking = false;
                    return;
                }

                // 2. Request Engine Move
                $.ajax({
                    type: 'POST',
                    url: '/engine_move',
                    contentType: 'application/json',
                    data: JSON.stringify({ use_nn: useNN }),
                    success: function(er) {
                        if (mySessionId !== currentSessionId) return;
                        
                        isEngineThinking = false;
                        
                        if (er.engine_move) {
                            if (playerColor === 'white') {
                                moveList[moveList.length - 1].black = er.engine_move;
                            } else {
                                moveList.push({ white: er.engine_move, black: null });
                            }
                            
                            var engineSource = er.engine_move.substring(0, 2);
                            var engineTarget = er.engine_move.substring(2, 4);
                            highlightMove(engineSource, engineTarget);
                        }
                        
                        renderHistory();
                        
                        // Update board WITH animation for engine move
                        board.position(er.fen, true);

                        if (er.eval) updateEval(er.eval);
                        handleStatus(er.status);
                    },
                    error: function() {
                        if (mySessionId !== currentSessionId) return;
                        isEngineThinking = false;
                        $status.text('Server error during engine move.');
                    }
                });
            },
            error: function() {
                if (mySessionId !== currentSessionId) return;
                isEngineThinking = false;
                $status.text('Server error during human move.');
            }
        });
    }

    function onSnapEnd() { /* handled by AJAX */ }

    // ─── New Game ───
    $('#newGameBtn').click(function() {
        if ($status.text().includes('Starting new game')) return; // Prevent double clicks

        currentSessionId++; // Invalidate any pending engine moves
        isEngineThinking = true;
        clearGameOver();
        board.position('start', false);
        moveList = [];
        renderHistory();
        $status.html('Starting new game… <div class="loader" style="display:inline-block;margin-bottom:-3px"></div>');

        $.ajax({
            type: 'POST',
            url: '/newgame',
            contentType: 'application/json',
            data: JSON.stringify({ use_nn: useNN, player_color: playerColor }),
            success: function(data) {
                isEngineThinking = false;
                board.orientation(playerColor);
                if (data.engine_move) {
                    moveList.push({ white: data.engine_move, black: null });
                    var engineSource = data.engine_move.substring(0, 2);
                    var engineTarget = data.engine_move.substring(2, 4);
                    highlightMove(engineSource, engineTarget);
                    renderHistory();
                } else {
                    highlightMove(null, null);
                }
                board.position(data.fen, !!data.engine_move);
                $status.text('Your turn (' + (playerColor === 'white' ? 'White' : 'Black') + ')');
                if (data.eval) updateEval(data.eval);
            },
            error: function() {
                isEngineThinking = false;
                $status.text('Error starting new game.');
            }
        });
    });

    $(window).resize(board.resize);
</script>
</body>
</html>
